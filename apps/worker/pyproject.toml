[project]
name = "jobpilot-worker"
version = "0.1.0"
description = "JobPilot UK ingestion + embedding workers (arq on Upstash Redis)"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jobpilot-schemas",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Lint config lives in the repo-root ruff.toml
