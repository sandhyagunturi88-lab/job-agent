[project]
name = "jobpilot-schemas"
version = "0.1.0"
description = "Shared data models for JobPilot UK (single source of truth; TS types mirror these)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpilot_schemas"]
