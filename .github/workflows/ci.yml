name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install ./packages/schemas "./apps/${{ matrix.app }}[dev]"
      - name: Lint
        run: ruff check apps/${{ matrix.app }}
      - name: Test
        run: pytest apps/${{ matrix.app }} -q
        working-directory: .
        env:
          PYTHONPATH: apps/${{ matrix.app }}/src

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --workspace apps/web
      - run: npm run test:extension

  deploy:
    # Deploys API + worker to Fly (lhr) on main. Vercel deploys the frontend
    # via its own Git integration. Requires the FLY_API_TOKEN repo secret.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config infra/fly.api.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --config infra/fly.worker.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
