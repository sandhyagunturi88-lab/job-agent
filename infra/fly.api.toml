# JobPilot UK API — Fly.io, London.
# Deploy from repo root: fly deploy --config infra/fly.api.toml
app = "jobpilot-uk-api"
primary_region = "lhr"

[build]
  dockerfile = "../apps/api/Dockerfile"

[env]
  APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero: WebSocket streams + resumable graph runs must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets (fly secrets set …): DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET, ANTHROPIC_API_KEY, REDIS_URL,
# CORS_ORIGINS=https://<your-vercel-domain>
